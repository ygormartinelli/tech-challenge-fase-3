[project]
name = "techchallenge-fase3"
version = "0.1.0"
description = "Classificador educacional de resumos médicos com FastAPI e ONNX Runtime."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "joblib>=1.4,<2.0",
  "numpy>=1.26,<3.0",
  "onnx>=1.16,<2.0",
  "onnxruntime>=1.19,<2.0",
  "pandas>=2.2,<3.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.13,<2.0",
  "skl2onnx>=1.17,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
build = ["hatchling>=1.26,<2"]
dev = [
  "ipykernel>=6.29,<7",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "pre-commit>=4,<5",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
