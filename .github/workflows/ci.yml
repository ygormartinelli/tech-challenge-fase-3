name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.11.8"
      - run: uv sync --frozen --all-groups
      - run: make lint
      - run: make test
      - run: uv pip check

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.11.8"
      - run: uv sync --frozen --all-groups
      - run: docker build -f docker/Dockerfile -t medical-classifier:ci .
      - run: uv run --frozen python scripts/smoke_image.py
      - run: docker compose -f docker/docker-compose.yml --profile airflow config --quiet

  airflow-contract:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.airflow -t medical-airflow:ci .
      - run: docker run --rm --entrypoint python -v "$PWD/scripts:/checks:ro" medical-airflow:ci /checks/verify_dag.py
