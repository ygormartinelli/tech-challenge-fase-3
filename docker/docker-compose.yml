name: tech-challenge-fase-3

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      MODEL_DIR: /app/models
      DATA_DIR: /app/data/synthetic_triage
      MODEL_VARIANT: ${MODEL_VARIANT:-optimized}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  airflow:
    profiles: ["airflow"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    command: airflow standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ../models:/opt/project/models
      - ../data/synthetic_triage:/opt/project/data/synthetic_triage:ro
      - ../reports:/opt/airflow/reports
      - ../dags:/opt/airflow/dags:ro
      - airflow-data:/opt/airflow
    restart: unless-stopped

volumes:
  airflow-data:
  grafana-data:
  prometheus-data:
